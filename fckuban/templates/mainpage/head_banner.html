{% load static %}
<section class="head-banner">
    <div class="main-banner">
        <img src="{% static 'images/logo-kuban.png' %}" class="kuban-logo">
        <div class="yellow-line"></div>
        <div class='green-line'>
            <div class="main-title">
                <h1>Официальный сайт</h1>
                <h2>Футбольного клуба «Кубань»</h2>
            </div>
        </div>
        <div class="underbanner">
            <div class="hashtag">#КУБАНЬЖИВА</div>
        </div>
        <div class='scoretable'>
            <nav class="scoretable-trigger">Турнирная Таблица</nav>
            <div class="scoretable-items" id='scoretable'>
            <table>
                <tbody>
                    <thead>
                        <th class="number">№</th>
                        <th>Команда</th>
                        <th>И</th>
                        <th>О</th>
                    </thead>
                    {% for team in teams %}
                        <tr class='{% if team.is_fcke %}special{% endif %}'>
                            <td class="number">{{ forloop.counter }}</td>
                            <td title="{{ team }}">{{ team.name }}</td>
                            <td>{{ team.matches }}</td>
                            <td>{{ team.points }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
            </div>
        </div>
    </div>
</section>
