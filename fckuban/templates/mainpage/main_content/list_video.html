{% load static embed_video_tags %}

<h3>ВИДЕОБЛОГ</h3>
<div class="news-items-wrap">
    {% for video_link in youtube_blog %}
    <div class="news-item">
        <a href="{{ video_link.link }}">
            <div class="top-caption">
                <span class="news-item-date">4:53,5июля2018</span>
                <span class="more-info">подробнее</span>
            </div>
            <div class="news-video-wrap">
                <div class="news-video">
                    {% video video_link.link '560 x 315' %}
                </div>
            </div>
            <p class="news-item-title">{{ video_link.description }}</p>
        </a>
    </div>
    {% endfor %}
    <div class="social-nets">
        <a href="{{ vk_link }}"><img src="{% static 'images/vk-g-logo.png' %}"></a>
        <a href="{{ facebook_link }}"><img src="{% static 'images/facebook-g-logo.png' %}"></a>
        <a href="{{ instagram_link }}"><img src="{% static 'images/instagram-g-logo.png' %}"></a>
    </div>
    <div class="button-wrap">
        <a href="{{ youtube_channel }}" class="another-news-button">Перейти в видеоблог</a>
    </div>
</div>
