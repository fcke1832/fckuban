{% load static %}
<div class="game-calendar">
    <h3>КАЛЕНДАРЬ</h3>
    <div class="calendar-nav">
        <div class="game-date">
            <div><span class="day">4</span><br>АВГ</div>
        </div>
        <div class="game-date"><span class="day">29</span><br>ИЮН</div>
        <div class="game-date"><span class="day">4</span><br>АВГ</div>
        <div class="game-date"><span class="day">29</span><br>ИЮН</div>
        <div class="game-date"><span class="day">4</span><br>АВГ</div>
        <div class="game-date"><span class="day">29</span><br>ИЮН</div>
        <div class="game-date"><span class="day">4</span><br>АВГ</div>
        <div class="game-date"><span class="day">29</span><br>ИЮН</div>
        <div class="game-date"><span class="day">4</span><br>АВГ</div>
    </div>
    <div class="calendar-info">
        {% for match in fcke_matches_list %}
            <div class="game-info">
                <h4 class="when-where">Суббота 19:00,<br>{{ match.stadium }}</h4>
                <div class="game-result">
                    <div class="team"><span><img src="{% static 'images/logo-kuban.png' %}"><br>{{ match.home_team }}</span></div>
                    <div class="score-versus">VS</div>
                    <div class="team"><span><img src="{% static 'images/spartak-moskva-logo.png' %}"><br>{{ match.guest_team }}</span></div>
                </div>
                <div class="tournament">{{ match.tournament }}<br>{{ match.tour }}</div>
                <div class="buy-tickets"></div>
            </div>
        {% endfor %}
    </div>
</div>
