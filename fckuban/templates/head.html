{% load static %}
<link rel="shortcut icon" href="{% static 'images/favicon.png' %}" type="image/png">
<link rel="stylesheet" type="text/css" href="{% static 'styles/normalize.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'slick/slick.css' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'slick/slick-custom-theme.css' %}"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.css">
<link rel="stylesheet" type="text/css" href="{% static 'styles/main.css' %}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>
    {% if is_news %}
        {{ news.title }} - Официальный сайт ФК 'Кубань'
    {% elif is_article %}
        {{ article.title }} - Официальный сайт ФК 'Кубань'
    {% elif not is_news and not is_article and seo.title %}
        {{ seo.title }}
    {% else %}
        Официальный сайт ФК 'Кубань'
    {% endif %}
</title>
<meta name="description" content="
    {% if is_news %}
        {{ news.title }} - {{ news.news_text|striptags|truncatewords:10 }}
    {% elif is_article %}
        {{ article.title }} - {{ article.news_text|striptags|truncatewords:10 }}
    {% elif not is_news and seo.description %}
        {{ seo.description }}
    {% endif %}">
<meta name="keywords" content="{{ seo.keywords }}">
