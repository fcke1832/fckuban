{% load static %}
<nav class="main-menu">
    <div class="menu-icon"><img src="{% static 'images/menu-icon.png' %}" alt="Меню"></div>
    <ul class="header-menu">
        <li><a href="{% url 'index' %}" title="Главная">Главная</a></li>
        <li><a href="{% url 'news:news_list' %}" title="Новости">Новости</a></li>
        <li><a href="http://ookuban.com/" target="_blank" title="КРОО">Организация</a></li>
        {% comment %}
        <li><a href="{% url 'team:all_team' %}" title="Команда">Команда</a></li>

        <li><a href="{% url 'news:news_list_preview' %}" rel="nofollow">Предпросмотр</a></li>

        <a href="{{ twitter_link }}" target="_blank"><img src="{% static 'images/twitter-black.png' %}"></a>
