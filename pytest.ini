[pytest]
DJANGO_SETTINGS_MODULE = fckuban.test_settings
python_files = tests.py test_*.py *_tests.py
testpaths =
    banner
    birthdays
    calendar_matches
    fckuban
    links
    medialinks
    news
    partners
    seo
    team
    tickets
    tournaments
    translation
addopts = -ra --strict-markers
filterwarnings =
    default
