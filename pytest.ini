[pytest]
DJANGO_SETTINGS_MODULE = fckuban.test_settings
python_files = tests.py test_*.py *_tests.py
testpaths =
    banner
    birthdays
    calendar_matches
    fckuban
    links
    medialinks
    news
    partners
    seo
    team
    tickets
    tournaments
    translation
# --nomigrations is temporary: team/0007 migration is broken (BUGS.md, BUG-023)
addopts = --nomigrations -ra --strict-markers
filterwarnings =
    default
