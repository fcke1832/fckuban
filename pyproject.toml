[project]
name = "fckuban"
version = "0.1.0"
description = "Сайт футбольного клуба Кубань"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # 5.2 — LTS-ветка (поддержка до апреля 2028); Python 3.14 поддержан с 5.2.8.
    "Django>=5.2.19,<5.3",
    "PyMySQL>=1.1,<2",
    "django-ckeditor>=6.7.4,<7",
    "django-embed-video>=1.4.10,<2",
    "transliterate>=1.10.2",
    "sorl-thumbnail>=13.4,<14",
    "Pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-django>=4.14,<5",
    "pytest-cov>=7.1,<8",
]

[tool.uv]
package = false
