[project]
name = "fckuban"
version = "0.1.0"
description = "Сайт футбольного клуба Кубань"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Django==3.2.25",
    "PyMySQL>=1.1,<2",
    "django-ckeditor==5.6.1",
    "django-embed-video==1.1.2",
    "transliterate>=1.10.2",
    "sorl-thumbnail==12.9.0",
    "Pillow>=9.5,<10",
    # sorl-thumbnail 12.9.0 (последняя с поддержкой Django 3.2) импортирует pkg_resources;
    # в setuptools>=81 модуль pkg_resources удалён, поэтому версия ограничена сверху.
    "setuptools>=68,<81",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-django==4.5.2",
    "pytest-cov==4.1.0",
]

[tool.uv]
package = false
